# Flight watch – Brno a okolie → Kalifornia, spiatočná letenka
# Všetko tu sa dá meniť bez zásahu do kódu.

# Odletové letiská. Každá skupina = 1 dopyt na SerpApi (Google Flights hľadá
# všetky letiská v skupine naraz). Menej skupín = menej spotrebovanej kvóty.
origin_groups:
  - [VIE, PRG, BTS, BUD, MUC]   # Viedeň, Praha, Bratislava, Budapešť, Mníchov
  - [FRA, BER, WAW, KRK, KTW]   # Frankfurt, Berlín, Varšava, Krakov, Katovice

destinations: [LAX, SFO, SAN, SJC, OAK]

window:
  earliest_departure: 2026-11-25
  latest_return: 2026-12-20      # posledný deň odletu z Kalifornie

max_leave_days: 12               # pracovné dni dovolenky
return_arrival_offset_days: 1    # let z USA prilieta do Európy nasledujúci deň
min_stay_days: 7
holidays: [2026-11-17, 2026-12-24, 2026-12-25, 2026-12-26]  # CZ sviatky (žiadny nie je v okne)

max_price_eur: 600
max_stops: 2                     # na jeden smer
max_duration_hours: 20           # na jeden smer
adults: 1
# Google Flights už nevie započítať odbavenú batožinu (filter Bags má len príručnú),
# a najlacnejšie transatlantické tarify (Light/Basic) ju väčšinou nemajú.
# Preto sa k cene pripočíta odhad. Uprav podľa reálnych cien dopravcov.
bag:
  fee_eur: 140                   # odhad tam aj späť (~70 € na smer)
  included_airlines: [Turkish Airlines, Emirates, Qatar Airways, Etihad]

source: google                   # google (priamo Google Flights, bez kľúča) | serpapi
google:
  max_requests_per_day: 28       # 14 dvojíc × 2 skupiny = všetko každý deň (+5 pre spiatočné lety)
  delay_seconds: [4, 9]          # náhodná pauza medzi dopytmi

budget:
  max_searches_per_day: 7        # free plán SerpApi = 250/mesiac; pri source: google = záloha, keď Google priamo zlyhá
  reserve: 10                    # nechaj rezervu na ručné behy
  max_pairs: 14                  # koľko kombinácií dátumov sledovať (najdlhšie pobyty)
  fetch_return_for_top: true     # +1 dopyt denne: detail spiatočného letu pre top ponuku

scoring:                         # "vyvážené" poradie = cena + penalizácie
  eur_per_lost_day: 20           # každý deň kratší pobyt ako najdlhší možný
  eur_per_hour_over_12h: 8       # každá hodina cesty tam nad 12 h
