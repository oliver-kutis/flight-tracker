name: flight-watch

on:
  schedule:
    - cron: "0 7 * * *"   # 04:00 UTC = 05:00/06:00 Prague
  workflow_dispatch: {}   # "Run workflow" button for manual runs

permissions:
  contents: write

concurrency:
  group: flight-watch
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: uv sync
      - name: Search flights
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: uv run flight_watch.py
      - name: Commit results
        run: |
          git config user.name "flight-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data REPORT.md
          git diff --cached --quiet || git commit -m "flight-watch $(date -u +%F)"
          git push
